services:
  arb-bot:
    build: .
    restart: unless-stopped        # auto-restart; cycles resume from data/cycles.json
    env_file: .env
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
